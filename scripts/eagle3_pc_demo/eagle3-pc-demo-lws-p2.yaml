##
# EAGLE3 Producer-Consumer POC — Phase 2
# Real verifier: K2.5 (TP=8) on youyun.37; real Eagle3 head on host-10-83-115-14
#
# Producer (rank 0 / leader): host-10-83-115-10, 8 GPUs
#   - Loads K2.5 via VllmHiddenStatesGenerator (TP=8)
#   - Sends aux_hs [B=2,S=128,3H=21504] bf16 + last_hs [B=2,S=128,H=7168] bf16
#   - Total ~14.7 MB/step
#
# Consumer (rank 1 / worker): host-10-83-115-14, 1 GPU
#   - Eagle3HeadPOC: FC(3H→H) + LayerNorm + SiLU-MLP residual
#   - MSE loss vs last_hs; backward + AdamW step
#   - Sends loss scalar back to producer
#
# Sync protocol (deferred NCCL P2P init, avoids 8-min idle timeout):
#   SYNC_PORT=29501   → TCP "ready" signal from producer after K2.5 loads
#   MASTER_PORT=29500 → P2P NCCL group (init AFTER TCP sync, not before)
#   MASTER_PORT=29502 → vLLM TP group (K2.5 workers on youyun.37)
#
# Usage:
#   scp eagle3-pc-demo-lws-p2.yaml youyun.37:/tmp/
#   ssh youyun.37 "kubectl apply -f /tmp/eagle3-pc-demo-lws-p2.yaml"
#
# Monitor:
#   kubectl logs -f eagle3-pc-demo-p2-0    # producer (leader)
#   kubectl logs -f eagle3-pc-demo-p2-0-1  # consumer (worker)
#
# Cleanup:
#   kubectl delete lws eagle3-pc-demo-p2
#   kubectl delete configmap eagle3-pc-demo-p2-scripts
##

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eagle3-pc-demo-p2-scripts
  namespace: default
data:
  producer_p2.py: |
    """
    EAGLE3 Producer-Consumer Demo Phase 2 - Producer (youyun.37)
    Loads K2.5 (TP=8) via VllmHiddenStatesGenerator.
    Sends hidden states [B,S,3H]+[B,S,H] to consumer via NCCL P2P.
    Sync: TCP on SYNC_PORT=29501 signals consumer when K2.5 loaded; NCCL P2P init after.
    """
    import os, sys, time, socket, logging
    import torch, torch.distributed as dist

    logging.basicConfig(level=logging.INFO,
        format="%(asctime)s.%(msecs)03d [producer] %(message)s", datefmt="%H:%M:%S")
    log = logging.getLogger(__name__)

    MODEL_PATH = "/data/models/Kimi-K2.5"
    LAYER_IDS  = [2, 30, 58, 60]
    B, S       = 2, 128
    NUM_STEPS  = 10
    WARMUP     = 2
    VLLM_PORT  = int(os.environ.get("VLLM_MASTER_PORT", "29502"))
    SYNC_PORT  = 29501

    def pack_hidden_states(results, device):
        n_aux = len(LAYER_IDS) - 1
        aux_list, last_list = [], []
        for r in results:
            hs = r["hidden_states"]
            aux = torch.cat([hs[j] for j in range(n_aux)], dim=-1)
            aux_list.append(aux.to(device=device, dtype=torch.bfloat16))
            last_list.append(hs[n_aux].to(device=device, dtype=torch.bfloat16))
        return torch.stack(aux_list), torch.stack(last_list)

    def tcp_signal_consumer(sync_port):
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("0.0.0.0", sync_port))
        s.listen(1)
        log.info(f"TCP sync: listening on :{sync_port}, waiting for consumer ...")
        conn, addr = s.accept()
        log.info(f"TCP sync: consumer connected from {addr}")
        conn.sendall(b"ready")
        conn.close()
        s.close()
        log.info("TCP sync: 'ready' sent — both sides will init NCCL now")

    def main():
        local_rank = int(os.environ.get("LOCAL_RANK", 0))
        torch.cuda.set_device(local_rank)
        device = torch.device(f"cuda:{local_rank}")

        master_addr = os.environ.get("MASTER_ADDR", "10.83.115.10")
        master_port = int(os.environ.get("MASTER_PORT", "29500"))

        # 1. Clear torchrun env vars + redirect MASTER_PORT before vLLM spawn
        os.environ["MASTER_PORT"] = str(VLLM_PORT)
        log.info(f"Redirected MASTER_PORT to {VLLM_PORT} for vLLM workers")
        _clear_before_vllm = [
            "RANK", "LOCAL_RANK", "WORLD_SIZE",
            "GROUP_RANK", "GROUP_WORLD_SIZE", "ROLE_RANK", "ROLE_WORLD_SIZE",
            "LOCAL_WORLD_SIZE",
            "TORCHELASTIC_RESTART_COUNT", "TORCHELASTIC_MAX_RESTARTS",
            "TORCHELASTIC_RUN_ID", "TORCHELASTIC_USE_AGENT_STORE",
            "NCCL_DEBUG", "NCCL_DEBUG_SUBSYS",
        ]
        cleared = {k: os.environ.pop(k) for k in _clear_before_vllm if k in os.environ}
        if cleared:
            log.info(f"Cleared {len(cleared)} env vars before vLLM spawn: {list(cleared.keys())}")

        # 2. Load K2.5 (8-9 min) — no NCCL P2P during this phase
        sys.path.insert(0, "/workspace/speculators/src")
        from speculators.data_generation.vllm_hidden_states_generator import VllmHiddenStatesGenerator
        log.info(f"Loading K2.5 TP=8 layers={LAYER_IDS} ...")
        t_load = time.time()
        generator = VllmHiddenStatesGenerator(
            model_path=MODEL_PATH, layer_ids=LAYER_IDS,
            max_model_len=512, gpu_memory_utilization=0.85,
            tensor_parallel_size=8, enforce_eager=True,
        )
        log.info(f"K2.5 loaded in {time.time()-t_load:.1f}s")

        # 3. TCP sync: signal consumer K2.5 ready, then both init NCCL P2P
        tcp_signal_consumer(SYNC_PORT)

        from datetime import timedelta
        log.info(f"Init P2P dist group rank=0 world=2 {master_addr}:{master_port}")
        dist.init_process_group(
            backend="nccl", rank=0, world_size=2,
            init_method=f"tcp://{master_addr}:{master_port}",
            timeout=timedelta(minutes=5),
        )
        assert dist.get_rank() == 0 and dist.get_world_size() == 2
        log.info("P2P dist group initialized")

        # 3b. Warm-up NCCL P2P communicator
        warmup = torch.zeros(1, dtype=torch.float32, device=device)
        dist.send(warmup, dst=1)
        dist.recv(warmup, src=1)
        log.info("P2P NCCL warm-up done")

        H = 7168
        aux_buf   = torch.empty(B, S, 3*H, dtype=torch.bfloat16, device=device)
        last_buf  = torch.empty(B, S,   H, dtype=torch.bfloat16, device=device)
        loss_recv = torch.zeros(1, dtype=torch.float32, device=device)
        nb = aux_buf.nbytes + last_buf.nbytes
        log.info(f"Transfer/step: {nb/1e6:.1f} MB  (aux={aux_buf.nbytes/1e6:.1f}MB last={last_buf.nbytes/1e6:.1f}MB)")

        token_ids = [[i % 9000 + 1000 for i in range(S)] for _ in range(B)]
        log.info(f"Starting loop: B={B} S={S} steps={NUM_STEPS}")

        latencies = []
        for step in range(NUM_STEPS):
            t0 = time.perf_counter()
            results = generator.generate(token_ids)
            gen_t = time.perf_counter() - t0

            aux_hs, last_hs = pack_hidden_states(results, device)
            aux_buf[:] = aux_hs
            last_buf[:] = last_hs

            dist.send(aux_buf, dst=1)
            dist.send(last_buf, dst=1)
            send_t = time.perf_counter() - t0

            dist.recv(loss_recv, src=1)
            total_t = time.perf_counter() - t0

            if step >= WARMUP:
                latencies.append(total_t)
            log.info(f"step {step:02d}: gen={gen_t*1000:.0f}ms send={send_t*1000:.1f}ms "
                     f"total={total_t*1000:.0f}ms consumer_loss={loss_recv.item():.4f}")

        if latencies:
            avg = sum(latencies)/len(latencies)
            log.info(f"\n=== PRODUCER SUMMARY ({len(latencies)} steps): avg={avg*1000:.0f}ms/step {nb/1e6:.1f}MB/step ===")

        dist.destroy_process_group()
        log.info("DONE")

    if __name__ == "__main__":
        main()

  consumer_p2.py: |
    """
    EAGLE3 Producer-Consumer Demo Phase 2 - Consumer (host-10-83-115-14)
    Receives hidden states from producer via NCCL P2P.
    Eagle3HeadPOC: FC(3H->H) + LayerNorm + SiLU-MLP residual. MSE loss.
    Sync: TCP poll on SYNC_PORT=29501 waits for producer 'ready'; NCCL P2P init after.
    No speculators dependency.
    """
    import os, time, socket, logging, traceback
    import torch, torch.nn as nn, torch.nn.functional as F, torch.distributed as dist

    logging.basicConfig(level=logging.INFO,
        format="%(asctime)s.%(msecs)03d [consumer] %(message)s", datefmt="%H:%M:%S")
    log = logging.getLogger(__name__)

    H, N_AUX   = 7168, 3
    B, S       = 2, 128
    LR         = 1e-4
    NUM_STEPS  = 10
    SYNC_PORT  = 29501

    class Eagle3HeadPOC(nn.Module):
        def __init__(self, H=7168, n_aux=3):
            super().__init__()
            self.fc   = nn.Linear(n_aux*H, H, bias=False)
            self.norm = nn.LayerNorm(H)
            self.w1   = nn.Linear(H, H*2, bias=False)
            self.w2   = nn.Linear(H*2, H, bias=False)
            self.act  = nn.SiLU()
        def forward(self, aux_hs):
            x = self.fc(aux_hs)
            x = self.norm(x.float()).bfloat16()
            return x + self.w2(self.act(self.w1(x)))

    def wait_for_producer_ready(producer_addr, sync_port=SYNC_PORT, poll_interval=5.0):
        log.info(f"TCP sync: polling {producer_addr}:{sync_port} every {poll_interval:.0f}s ...")
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(5.0)
                s.connect((producer_addr, sync_port))
                msg = s.recv(5)
                s.close()
                if msg == b"ready":
                    log.info("TCP sync: received 'ready' — producer K2.5 loaded, init NCCL now")
                    return
            except (ConnectionRefusedError, socket.timeout, OSError):
                pass
            time.sleep(poll_interval)

    def main():
        local_rank = int(os.environ.get("LOCAL_RANK", 0))
        torch.cuda.set_device(local_rank)
        device = torch.device(f"cuda:{local_rank}")

        master_addr = os.environ.get("MASTER_ADDR", "10.83.115.10")
        master_port = int(os.environ.get("MASTER_PORT", "29500"))

        # 1. Init Eagle3 head + optimizer while producer loads K2.5
        model = Eagle3HeadPOC(H=H, n_aux=N_AUX).to(device=device, dtype=torch.bfloat16)
        optimizer = torch.optim.AdamW(model.parameters(), lr=LR)
        n_params = sum(p.numel() for p in model.parameters())
        log.info(f"Eagle3HeadPOC: {n_params:,} params  device={device}")

        # 2. Wait for producer to finish loading K2.5 (TCP poll, no NCCL during this phase)
        wait_for_producer_ready(master_addr, sync_port=SYNC_PORT)

        # 3. Init P2P dist group — both sides ready now, fast init
        from datetime import timedelta
        log.info(f"Init P2P dist group rank=1 world=2 {master_addr}:{master_port}")
        dist.init_process_group(
            backend="nccl", rank=1, world_size=2,
            init_method=f"tcp://{master_addr}:{master_port}",
            timeout=timedelta(minutes=5),
        )
        assert dist.get_rank() == 1 and dist.get_world_size() == 2
        log.info("P2P dist group initialized")

        # 3b. Warm-up NCCL P2P communicator
        warmup = torch.zeros(1, dtype=torch.float32, device=device)
        dist.recv(warmup, src=0)
        dist.send(warmup, dst=0)
        log.info("P2P NCCL warm-up done — starting main loop")

        aux_buf   = torch.empty(B, S, N_AUX*H, dtype=torch.bfloat16, device=device)
        last_buf  = torch.empty(B, S, H,       dtype=torch.bfloat16, device=device)
        loss_send = torch.zeros(1, dtype=torch.float32, device=device)
        nb = aux_buf.nbytes + last_buf.nbytes
        log.info(f"Buffers: {nb/1e6:.1f} MB/step")

        losses = []
        try:
            for step in range(NUM_STEPS):
                t0 = time.perf_counter()
                dist.recv(aux_buf, src=0)
                dist.recv(last_buf, src=0)
                recv_t = time.perf_counter() - t0

                optimizer.zero_grad()
                draft_hs = model(aux_buf)
                loss = F.mse_loss(draft_hs.float(), last_buf.float())
                loss.backward()
                optimizer.step()
                train_t = time.perf_counter() - t0

                loss_val = loss.item()
                losses.append(loss_val)
                loss_send[0] = loss_val
                dist.send(loss_send, dst=0)
                log.info(f"step {step:02d}: recv={recv_t*1000:.1f}ms train={train_t*1000:.1f}ms "
                         f"bw={nb/recv_t/1e9:.2f}GB/s loss={loss_val:.4f}")
        except Exception as e:
            log.error(f"EXCEPTION in consumer loop: {type(e).__name__}: {e}")
            log.error(traceback.format_exc())
            raise

        if losses:
            log.info(f"\n=== CONSUMER SUMMARY ({NUM_STEPS} steps) ===")
            log.info(f"  loss: {losses[0]:.4f} -> {losses[-1]:.4f} "
                     f"({'decreasing' if losses[-1] < losses[0] else 'not decreasing'})")
            log.info(f"  params: {n_params:,}")

        dist.destroy_process_group()
        log.info("DONE")

    if __name__ == "__main__":
        main()

---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: eagle3-pc-demo-p2
  namespace: default
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: None
    leaderTemplate:
      metadata:
        labels:
          role: producer
          app: eagle3-pc-demo-p2
      spec:
        nodeName: host-10-83-115-10
        hostNetwork: true
        containers:
        - name: worker
          image: docker.io/library/speculators:v0.17.0
          imagePullPolicy: Never
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -e
            echo "=== EAGLE3 PC Demo Phase 2 — PRODUCER ==="
            echo "  hostname: $(hostname)"
            echo "  LWS_WORKER_INDEX: ${LWS_WORKER_INDEX}"
            echo "  MASTER_ADDR: ${MASTER_ADDR}  MASTER_PORT: ${MASTER_PORT}"
            nvidia-smi -L
            echo "=== installing speculators from source ==="
            pip install -e /workspace/speculators[training] --quiet --no-build-isolation 2>&1 | tail -3
            echo "=== launching torchrun ==="
            torchrun \
              --nnodes=2 \
              --nproc_per_node=1 \
              --node_rank=0 \
              --master_addr=${MASTER_ADDR} \
              --master_port=${MASTER_PORT} \
              /scripts/producer_p2.py
            echo "=== PRODUCER DONE ==="
            tail -f /dev/null
          env:
          - name: MASTER_ADDR
            value: "10.83.115.10"
          - name: MASTER_PORT
            value: "29500"
          - name: VLLM_MASTER_PORT
            value: "29502"
          - name: NCCL_SOCKET_IFNAME
            value: "b_manage0"
          - name: GLOO_SOCKET_IFNAME
            value: "b_manage0"
          - name: NCCL_IB_DISABLE
            value: "0"
          - name: NCCL_IB_GID_INDEX
            value: "3"
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              nvidia.com/gpu: "8"
          volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: speculators
            mountPath: /workspace/speculators
          - name: models
            mountPath: /data/models
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
          - name: infiniband
            mountPath: /dev/infiniband
        volumes:
        - name: scripts
          configMap:
            name: eagle3-pc-demo-p2-scripts
        - name: speculators
          hostPath:
            path: /root/work/speculators
            type: Directory
        - name: models
          hostPath:
            path: /data/models
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
    workerTemplate:
      metadata:
        labels:
          role: consumer
          app: eagle3-pc-demo-p2
      spec:
        nodeName: host-10-83-115-14
        hostNetwork: true
        containers:
        - name: worker
          image: docker.io/library/speculators:v0.17.0
          imagePullPolicy: Never
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -e
            echo "=== EAGLE3 PC Demo Phase 2 — CONSUMER ==="
            echo "  hostname: $(hostname)"
            echo "  LWS_WORKER_INDEX: ${LWS_WORKER_INDEX}"
            echo "  MASTER_ADDR: ${MASTER_ADDR}  MASTER_PORT: ${MASTER_PORT}"
            nvidia-smi -L
            echo "=== launching torchrun ==="
            torchrun \
              --nnodes=2 \
              --nproc_per_node=1 \
              --node_rank=1 \
              --master_addr=${MASTER_ADDR} \
              --master_port=${MASTER_PORT} \
              /scripts/consumer_p2.py
            echo "=== CONSUMER DONE ==="
            tail -f /dev/null
          env:
          - name: MASTER_ADDR
            value: "10.83.115.10"
          - name: MASTER_PORT
            value: "29500"
          - name: NCCL_SOCKET_IFNAME
            value: "b_manage0"
          - name: GLOO_SOCKET_IFNAME
            value: "b_manage0"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_IB_GID_INDEX
            value: "3"
          - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
            value: "0"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: dshm
            mountPath: /dev/shm
          - name: infiniband
            mountPath: /dev/infiniband
        volumes:
        - name: scripts
          configMap:
            name: eagle3-pc-demo-p2-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
